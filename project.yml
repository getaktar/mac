name: Aktar
options:
  bundleIdPrefix: com.getaktar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

# One version for the app and its Share extension, which must match.
settings:
  base:
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "14"

packages:
  Soto:
    url: https://github.com/soto-project/soto.git
    from: 7.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 1.9.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.7.0
  # WebP encoding for Image Processing; ImageIO can only read WebP.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    from: 1.5.0

targets:
  Aktar:
    type: application
    platform: macOS
    sources:
      - path: Sources/Aktar
    dependencies:
      - package: Soto
        product: SotoS3
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: libwebp
      - sdk: PDFKit.framework
      - target: AktarShare
    # One scheme that builds the app and runs the unit tests.
    scheme:
      testTargets:
        - AktarTests
    info:
      path: Sources/Aktar/Info.plist
      properties:
        # XcodeGen writes placeholder versions into Info.plist; point them
        # back at the build settings so MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION stay the single source of truth.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: the feed is an asset of the latest GitHub release, and
        # every update must be signed with the matching EdDSA private key
        # (kept in the release machine's login Keychain; see release.sh).
        SUFeedURL: https://github.com/getaktar/mac/releases/latest/download/appcast.xml
        SUPublicEDKey: +IpZTPTgNR/L/LUW8RMQEY6yzAKG4MTngEbS26PkqD8=
        # Sandboxed apps install updates through Sparkle's XPC installer.
        SUEnableInstallerLauncherService: true
        # aktar:// links (upload-clipboard, library, settings, connect),
        # used by the Raycast extension; see URLSchemeHandler.
        CFBundleURLTypes:
          - CFBundleURLName: com.getaktar.mac
            CFBundleURLSchemes:
              - aktar
        # "Upload with Aktar" for files selected in Finder (right-click >
        # Quick Actions or Services); see FinderService. The title is
        # translated in ServicesMenu.xcstrings.
        NSServices:
          - NSMenuItem:
              default: Upload with Aktar
            NSMessage: uploadFiles
            NSPortName: Aktar
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
          # "Watch Folder with Aktar" for a folder selected in Finder: opens
          # Settings > Watched Folders to add it; see FinderService.
          - NSMenuItem:
              default: Watch Folder with Aktar
            NSMessage: watchFolder
            NSPortName: Aktar
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getaktar.mac
        PRODUCT_NAME: Aktar
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: Sources/Aktar/Aktar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Mert Topuz"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  # "Aktar" in the Share menu of Finder and other apps. It passes the shared
  # files to the app's "Upload with Aktar" service; see ShareViewController.
  AktarShare:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/AktarShare
    info:
      path: Sources/AktarShare/Info.plist
      properties:
        CFBundleDisplayName: Aktar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 50
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 50
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getaktar.mac.share
        PRODUCT_NAME: AktarShare
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/AktarShare/AktarShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  # Unit tests for the Watched Folders engine. It's built from the engine's
  # own sources (it doesn't need the app around it), so the tests run
  # without launching Aktar.
  AktarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AktarTests
      - path: Sources/Aktar/Watch/Engine
      - path: Sources/Aktar/Upload/ObjectKeyGenerator.swift
      - path: Sources/Aktar/Upload/ContentHasher.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getaktar.mac.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
